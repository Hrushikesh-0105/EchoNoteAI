<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Note</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <div class="logo-icon">
                <svg class="icon" viewBox="0 0 24 24">
                    <rect x="9" y="2" width="6" height="12" rx="3"/>
                    <path d="M5 10v1a7 7 0 0 0 14 0v-1"/>
                    <line x1="12" y1="18" x2="12" y2="22"/>
                    <line x1="8" y1="22" x2="16" y2="22"/>
                </svg>
            </div>
            <h1 class="product-name">Echo Note</h1>
            <p class="tagline">Smart Meeting Recorder</p>
        </div>

        <p class="description">
            Transform your online classes and meetings into intelligent, searchable notes. Record, transcribe, and get AI-powered summaries automatically.
        </p>

        <button class="btn-brutal primary signin-button" id="signinButton">
            Sign In to Continue
        </button>

        <div class="features">
            <span class="feature-icon" title="Record">
                <svg class="icon" viewBox="0 0 24 24">
                    <rect x="9" y="2" width="6" height="12" rx="3"/>
                    <path d="M5 10v1a7 7 0 0 0 14 0v-1"/>
                    <line x1="12" y1="18" x2="12" y2="22"/>
                    <line x1="8" y1="22" x2="16" y2="22"/>
                </svg>
            </span>
            <span class="feature-icon" title="AI Summary">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/>
                </svg>
            </span>
            <span class="feature-icon" title="Smart Notes">
                <svg class="icon" viewBox="0 0 24 24">
                    <rect x="4" y="3" width="16" height="18" rx="2"/>
                    <line x1="8" y1="8" x2="16" y2="8"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                    <line x1="8" y1="16" x2="12" y2="16"/>
                </svg>
            </span>
            <span class="feature-icon" title="Cloud Sync">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M7 18a4 4 0 0 1-1-7.874A5 5 0 0 1 15.9 8.1 4.5 4.5 0 0 1 17.5 17H7z"/>
                </svg>
            </span>
        </div>
    </div>

    <div class="version">v1.0</div>

    <script src="../config.js"></script>
    <script src="app.js"></script>
</body>
</html>
